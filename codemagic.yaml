workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.daudabangoura.stillhere.app
      vars:
        XCODE_SCHEME: "App"
        IOS_BUILD_NUMBER: "14"
      node: v22.0.0
    integrations:
      app_store_connect: BrainSprout Kids
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Install Transistorsoft plugin (if licensed)
        script: |
          if [ -n "$TRANSISTORSOFT_LICENSE_KEY" ]; then
            echo "Transistorsoft license found, installing background geolocation plugin..."
            npm install @transistorsoft/capacitor-background-geolocation
          else
            echo "No Transistorsoft license key — skipping native background geolocation plugin"
            echo "App will use @capacitor/geolocation fallback"
          fi
      - name: Build web assets
        script: |
          npm run build
      - name: Inject Transistorsoft license (if available)
        script: |
          if [ -n "$TRANSISTORSOFT_LICENSE_KEY" ]; then
            echo "Injecting Transistorsoft license key into Capacitor config..."
            node -e "
              const fs = require('fs');
              const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
              cfg.plugins = cfg.plugins || {};
              cfg.plugins.BackgroundGeolocation = cfg.plugins.BackgroundGeolocation || {};
              cfg.plugins.BackgroundGeolocation.license = process.env.TRANSISTORSOFT_LICENSE_KEY;
              fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
              console.log('License key injected successfully');
            "
          fi
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Verify iOS project configuration
        script: |
          echo "=== Checking background modes ==="
          cd ios/App/App
          if [ -f Info.plist ]; then
            /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" Info.plist 2>/dev/null || echo "UIBackgroundModes will be set by Capacitor sync"
          fi
          echo ""
          echo "=== Checking location permissions ==="
          if [ -f Info.plist ]; then
            /usr/libexec/PlistBuddy -c "Print :NSLocationAlwaysAndWhenInUseUsageDescription" Info.plist 2>/dev/null || echo "Location permissions will be set by Capacitor sync"
          fi
          echo ""
          echo "=== Build configuration looks good ==="
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Bump build number
        script: |
          cd ios/App
          if [ -n "$IOS_BUILD_NUMBER" ]; then
            BUILD_NUMBER="$IOS_BUILD_NUMBER"
            LATEST_TESTFLIGHT_BUILD="not-checked"
          else
            LATEST_TESTFLIGHT_BUILD=0
            if [ -n "$APP_STORE_APP_ID" ]; then
              LATEST_TESTFLIGHT_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
            fi
            FALLBACK_BUILD_NUMBER=${CM_BUILD_NUMBER:-14}
            BUILD_NUMBER=$((LATEST_TESTFLIGHT_BUILD + 1))
            if [ "$BUILD_NUMBER" -lt "$FALLBACK_BUILD_NUMBER" ]; then
              BUILD_NUMBER=$FALLBACK_BUILD_NUMBER
            fi
          fi
          agvtool new-version -all $BUILD_NUMBER
          agvtool new-marketing-version 1.0
          echo "Latest TestFlight build: $LATEST_TESTFLIGHT_BUILD"
          echo "Codemagic build number: ${CM_BUILD_NUMBER:-not-set}"
          echo "Build number: $BUILD_NUMBER"
      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testing
