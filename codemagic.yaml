workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.daudabangoura.stillhere.safety
      vars:
        XCODE_SCHEME: "App"
      node: v22.12.0
    integrations:
      app_store_connect: BrainSprout Kids
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Verify Transistorsoft license
        script: |
          export TRANSISTORSOFT_LICENSE_KEY="${TRANSISTORSOFT_LICENSE_KEY:-${TRANSISTORSOFT_LICENSE:-${BACKGROUND_GEOLOCATION_LICENSE_KEY:-${BACKGROUND_GEOLOCATION_LICENSE:-}}}}"
          if [ -z "$TRANSISTORSOFT_LICENSE_KEY" ]; then
            echo "WARNING: TRANSISTORSOFT_LICENSE_KEY is not set."
            echo "TestFlight build will continue with licensed native background location disabled."
            echo "Live location will work only while the app is open until the real license is added."
            echo "Add it later as TRANSISTORSOFT_LICENSE_KEY. Accepted fallback names: TRANSISTORSOFT_LICENSE, BACKGROUND_GEOLOCATION_LICENSE_KEY, BACKGROUND_GEOLOCATION_LICENSE."
            echo "false" > .transistorsoft-licensed
          else
            echo "true" > .transistorsoft-licensed
            echo "Transistorsoft license found. Native background geolocation will be configured."
          fi
      - name: Build web assets
        script: |
          export VITE_TRANSISTORSOFT_LICENSED="$(cat .transistorsoft-licensed 2>/dev/null || echo false)"
          npm run build
      - name: Inject Transistorsoft license
        script: |
          export TRANSISTORSOFT_LICENSE_KEY="${TRANSISTORSOFT_LICENSE_KEY:-${TRANSISTORSOFT_LICENSE:-${BACKGROUND_GEOLOCATION_LICENSE_KEY:-${BACKGROUND_GEOLOCATION_LICENSE:-}}}}"
          if [ -z "$TRANSISTORSOFT_LICENSE_KEY" ]; then
            echo "No Transistorsoft license to inject. Disabling native background geolocation in Capacitor config for this build."
            node -e "
              const fs = require('fs');
              const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
              cfg.plugins = cfg.plugins || {};
              cfg.plugins.BackgroundGeolocation = cfg.plugins.BackgroundGeolocation || {};
              cfg.plugins.BackgroundGeolocation.enabled = false;
              delete cfg.plugins.BackgroundGeolocation.license;
              fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
              console.log('BackgroundGeolocation disabled for unlicensed TestFlight build');
            "
          else
            echo "Injecting Transistorsoft license key into Capacitor config..."
            node -e "
              const fs = require('fs');
              const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
              cfg.plugins = cfg.plugins || {};
              cfg.plugins.BackgroundGeolocation = cfg.plugins.BackgroundGeolocation || {};
              cfg.plugins.BackgroundGeolocation.enabled = true;
              cfg.plugins.BackgroundGeolocation.license = process.env.TRANSISTORSOFT_LICENSE_KEY;
              fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
              console.log('License key injected successfully');
            "
          fi
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Verify iOS project configuration
        script: |
          echo "=== Checking background modes ==="
          cd ios/App/App
          if [ -f Info.plist ]; then
            /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" Info.plist 2>/dev/null || echo "UIBackgroundModes will be set by Capacitor sync"
          fi
          echo ""
          echo "=== Checking location permissions ==="
          if [ -f Info.plist ]; then
            /usr/libexec/PlistBuddy -c "Print :NSLocationAlwaysAndWhenInUseUsageDescription" Info.plist 2>/dev/null || echo "Location permissions will be set by Capacitor sync"
          fi
          echo ""
          echo "=== Build configuration looks good ==="
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Bump build number
        script: |
          cd ios/App
          BUILD_NUMBER="$(date -u +%Y%m%d%H%M)"
          agvtool new-version -all $BUILD_NUMBER
          agvtool new-marketing-version 1.0
          echo "Build number: $BUILD_NUMBER"
      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
