steps:
  - name: node:22-bookworm-slim
    entrypoint: bash
    secretEnv:
      - DATABASE_URL
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl
        curl -fsSL -o /usr/local/bin/cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.18.3/cloud-sql-proxy.linux.amd64
        chmod +x /usr/local/bin/cloud-sql-proxy
        mkdir -p /cloudsql
        cloud-sql-proxy --unix-socket /cloudsql stillhere-492915:australia-southeast1:stillhere-prod &
        sleep 5
        npm ci
        npm run db:push
availableSecrets:
  secretManager:
    - versionName: projects/stillhere-492915/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL
